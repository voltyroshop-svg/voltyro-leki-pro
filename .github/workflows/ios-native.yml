name: iOS native build

on:
  push:
    branches: [feature/native-reminders]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-native-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check tools and runtimes
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          node --version
          npm --version
      - name: Install locked dependencies and test
        run: |
          npm ci
          npm test
      - name: Sync iOS project
        run: |
          npm run mobile:build
          npx --no-install cap sync ios
          plutil -lint ios/App/App/Info.plist ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -list -project ios/App/App.xcodeproj
      - name: Build unsigned device app
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ios-diagnostics"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-device" \
            -resultBundlePath "$RUNNER_TEMP/ios-diagnostics/device.xcresult" \
            CODE_SIGNING_ALLOWED=NO ENABLE_DEBUG_DYLIB=NO build 2>&1 | tee "$RUNNER_TEMP/ios-diagnostics/device.log"
      - name: Verify packaged device app and create unsigned IPA
        shell: bash
        run: |
          app="$RUNNER_TEMP/ios-device/Build/Products/Debug-iphoneos/App.app"
          test -x "$app/App"
          test -s "$app/public/index.html"
          test -s "$app/public/native-reminders.js"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = pl.voltyro.leki
          lipo "$app/App" -verify_arch arm64
          xcrun strings -a "$app/App" > "$RUNNER_TEMP/ios-diagnostics/device-symbols.txt"
          grep -q 'LocalNotificationsPlugin' "$RUNNER_TEMP/ios-diagnostics/device-symbols.txt"
          grep -q 'UNCalendarNotificationTrigger' "$RUNNER_TEMP/ios-diagnostics/device-symbols.txt"
          rm "$RUNNER_TEMP/ios-diagnostics/device-symbols.txt"
          mkdir -p "$RUNNER_TEMP/ios-package/Payload"
          ditto "$app" "$RUNNER_TEMP/ios-package/Payload/App.app"
          cd "$RUNNER_TEMP/ios-package"
          ditto -c -k --keepParent Payload VOLTYRO-Leki-PRO-unsigned.ipa
          unzip -tq VOLTYRO-Leki-PRO-unsigned.ipa
      - uses: actions/upload-artifact@v6
        with:
          name: voltyro-leki-ios-unsigned
          path: ${{ runner.temp }}/ios-package/VOLTYRO-Leki-PRO-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-build-diagnostics
          path: ${{ runner.temp }}/ios-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
